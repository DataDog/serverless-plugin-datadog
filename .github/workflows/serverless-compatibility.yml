name: Serverless compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Serverless 1.83.3
            package: serverless@1.83.3
            binary: serverless
          - name: Serverless 2.72.4
            package: serverless@2.72.4
            binary: serverless
          - name: Serverless 3.39.0
            package: serverless@3.39.0
            binary: serverless
          - name: OSLS 3.77.0
            package: osls@3.77.0
            binary: osls
          - name: OSLS 4.1.0
            package: osls@4.1.0
            binary: osls

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Set up Yarn
        run: corepack enable && corepack prepare yarn@4.17.1 --activate

      - name: Install plugin dependencies
        run: yarn install --immutable

      - name: Build plugin
        run: yarn build

      - name: AWS auth (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_E2E }}
          aws-region: ${{ vars.AWS_REGION_E2E || 'ap-northeast-3' }}

      - name: Package a consumer service
        run: ./scripts/check-serverless-compatibility.sh
        env:
          SERVERLESS_PACKAGE: ${{ matrix.package }}
          SERVERLESS_BINARY: ${{ matrix.binary }}
